<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Abyssal Navy -->
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E34" />
      <stop offset="60%" stop-color="#051424" />
      <stop offset="100%" stop-color="#020912" />
    </linearGradient>

    <!-- Primary Wave Gradient: Electric Cyan to Royal Ocean -->
    <linearGradient id="msWaveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Secondary Depth Wave Gradient -->
    <linearGradient id="msDepthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022E57" stop-opacity="0.2" />
    </linearGradient>

    <!-- Scope Ring Gradient -->
    <linearGradient id="msScopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="64" height="64" rx="16" fill="url(#msBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#13385C" stroke-width="1.5" />

  <!-- Outer Optical Sight / Radar Scope Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#msScopeGrad)" stroke-width="2" stroke-dasharray="28 5 28 5" stroke-linecap="round" />

  <!-- Precision Optical Reticle Ticks -->
  <line x1="32" y1="7" x2="32" y2="11.5" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="52.5" x2="32" y2="57" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="7" y1="32" x2="11.5" y2="32" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="52.5" y1="32" x2="57" y2="32" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />

  <!-- Secondary Ocean Depth Wave -->
  <path d="M12 43C19 37 26 44 35 38C42 33.5 47 35 52 38.5V47C52 47 43 50.5 32 50.5C21 50.5 12 47 12 47V43Z" fill="url(#msDepthGrad)" />

  <!-- Primary Marine Wave (Dynamic Oceanic Surge) -->
  <path d="M11 44.5C17 37 23.5 44 32.5 38.5C39.5 34 45 35 53 28.5C49 41.5 42 47.5 32 47.5C22 47.5 15 46 11 44.5Z" fill="url(#msWaveGrad)" />

  <!-- Crisp White Wave Crest Highlight -->
  <path d="M12 44C17.5 37.2 24 43.8 32.5 38C39.5 33.5 45.2 34.5 52.8 28.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

  <!-- Central Sight Reticle / Satellite Eye -->
  <circle cx="32" cy="22" r="5.5" stroke="#00F5FF" stroke-width="1.8" fill="#061626" />
  <circle cx="32" cy="22" r="2.2" fill="#00F5FF" />
  <line x1="32" y1="13.5" x2="32" y2="15.5" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="28.5" x2="32" y2="30.5" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="23.5" y1="22" x2="25.5" y2="22" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="38.5" y1="22" x2="40.5" y2="22" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />

  <!-- Active Telemetry Sensor Ping -->
  <circle cx="49" cy="14" r="2.5" fill="#10B981" />
  <circle cx="49" cy="14" r="4.5" stroke="#10B981" stroke-width="0.8" opacity="0.7" />
</svg>
